<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #0f0f0f;
      color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {
      background: #1a1a1a;
      padding: 40px;
      border-radius: 12px;
      width: 360px;
      border: 1px solid #2a2a2a;
    }
    h2 { margin-bottom: 24px; font-size: 22px; }
    .tabs { display: flex; gap: 12px; margin-bottom: 24px; }
    .tab {
      flex: 1; padding: 8px; background: none; border: 1px solid #333;
      color: #aaa; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    .tab.active { border-color: #7c6af7; color: #fff; background: #2a2560; }
    input {
      width: 100%; padding: 10px 12px; margin-bottom: 12px;
      background: #111; border: 1px solid #333; border-radius: 6px;
      color: #eee; font-size: 14px;
    }
    input:focus { outline: none; border-color: #7c6af7; }
    button[type=submit] {
      width: 100%; padding: 11px; background: #7c6af7;
      border: none; border-radius: 6px; color: #fff;
      font-size: 15px; cursor: pointer; margin-top: 4px;
    }
    button[type=submit]:hover { background: #6a59e0; }
    .msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }
    .msg.error { color: #f87171; }
    .msg.success { color: #4ade80; }
  </style>
</head>
<body>
<div class="card">
  <h2>Bienvenido</h2>

  <div class="tabs">
    <button class="tab active" onclick="showTab('login')">Iniciar sesión</button>
    <button class="tab" onclick="showTab('register')">Registrarse</button>
  </div>

  <!-- Login -->
  <form id="login-form" onsubmit="handleLogin(event)">
    <input type="email"    id="login-email"    placeholder="Email" required />
    <input type="password" id="login-password" placeholder="Contraseña" required />
    <button type="submit">Entrar</button>
  </form>

  <!-- Registro -->
  <form id="register-form" style="display:none" onsubmit="handleRegister(event)">
    <input type="text"     id="reg-username" placeholder="Nombre de usuario" required />
    <input type="email"    id="reg-email"    placeholder="Email" required />
    <input type="password" id="reg-password" placeholder="Contraseña (mín. 8 caracteres)" required />
    <button type="submit">Crear cuenta</button>
  </form>

  <p class="msg" id="msg"></p>
</div>

<script>
  // Obtiene el puerto de Unity desde la URL: ?port=5000&state=XYZ
  const params  = new URLSearchParams(window.location.search);
  const port    = params.get('port');
  const state   = params.get('state');

  function showTab(tab) {
    document.getElementById('login-form').style.display    = tab === 'login'    ? '' : 'none';
    document.getElementById('register-form').style.display = tab === 'register' ? '' : 'none';
    document.querySelectorAll('.tab').forEach((t, i) =>
      t.classList.toggle('active', (i === 0) === (tab === 'login'))
    );
    document.getElementById('msg').textContent = '';
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email    = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    try {
      const res  = await fetch('http://localhost:3000/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (!res.ok) return showMsg(data.error, 'error');

      showMsg('¡Login exitoso! Volviendo al juego...', 'success');
      // Redirige al servidor local de Unity
      setTimeout(() => {
        if (!port || !state) {
            showMsg('Faltan parámetros de Unity', 'error');
            return;
        }
        window.location.href = `http://localhost:${port}/callback?token=${data.token}&state=${state}`;
      }, 1000);

    } catch {
      showMsg('No se pudo conectar al servidor', 'error');
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    const username = document.getElementById('reg-username').value;
    const email    = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;

    try {
      const res  = await fetch('http://localhost:3000/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password }),
      });
      const data = await res.json();

      if (!res.ok) return showMsg(data.error, 'error');

      showMsg('¡Cuenta creada! Volviendo al juego...', 'success');
      setTimeout(() => {
        if (!port || !state) {
            showMsg('Faltan parámetros de Unity', 'error');
            return;
        }
        window.location.href = `http://localhost:${port}/callback?token=${data.token}&state=${state}`;
      }, 1000);

    } catch {
      showMsg('No se pudo conectar al servidor', 'error');
    }
  }
</script>
</body>
</html>
